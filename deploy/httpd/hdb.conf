# --- epic-hdb (ePIC Hardware Database) ---------------------------------
# Installed as /etc/httpd/conf.d/hdb.conf on epic-hwdb01.
#
# Reverse-proxies to the gunicorn service (hdb-gunicorn.service, bound to
# 127.0.0.1:8002); /static/ and /media/ are served directly by httpd
# instead of being proxied through gunicorn. See CLAUDE.md's "Deployment"
# section for the plan this implements.
#
# Requires (see CLAUDE.md):
#   - SELinux: httpd_sys_content_t on /var/data/hdb/static,
#     httpd_sys_rw_content_t on /var/data/hdb/media, and the
#     httpd_can_network_connect boolean enabled.
#   - hdb_project/settings.py: STATIC_ROOT = '/var/data/hdb/static'
#     (already set), collectstatic already run.
<VirtualHost *:80>
    ServerName epic-hwdb01.sdcc.bnl.gov

    Alias /static/ /var/data/hdb/static/
    <Directory /var/data/hdb/static>
        Require all granted
    </Directory>

    Alias /media/ /var/data/hdb/media/
    <Directory /var/data/hdb/media>
        Require all granted
    </Directory>

    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://127.0.0.1:8002/
    ProxyPassReverse / http://127.0.0.1:8002/

    ErrorLog "logs/hdb_error_log"
    CustomLog "logs/hdb_access_log" combined
</VirtualHost>
